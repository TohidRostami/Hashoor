services:
  app:
    build: .
    restart: always
    env_file:
      - .env
    volumes:
      # دیتابیس SQLite واقعی این‌جا زندگی می‌کنه — با rebuild ایمیج پاک نمی‌شه.
      - app-data:/app/data
    networks:
      - web
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - web
    depends_on:
      - app

networks:
  web:

volumes:
  app-data:
  caddy-data:
  caddy-config:
